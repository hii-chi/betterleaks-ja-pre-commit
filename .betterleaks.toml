# .githooks/pre-commit が --config で読む Betterleaks の設定。
# デフォルトのルールは英語の password / token などを手がかりにするので、日本語の文中の「パスワードは xxx」を足す。
[extend]
useDefault = true

# 値は ASCII の英数字と記号（空白と引用符を除く）の 4 文字以上だけを拾う（「パスワードは自分で決めます」「8 文字以上」「`<パスワード>`」は対象外）。
# keywords は付けない。日本語のキーワードを付けると、事前の絞り込みで一致せずルールが動かない（v1.9.0 で確認）。
[[rules]]
id = "ja-password"
description = "日本語の文中に書かれたパスワード・パスフレーズ・暗証番号"
regex = '''(?:パスワード|パスフレーズ|暗証番号)\s*(?:は|が|:|：|=)\s*[`"'「]?([A-Za-z0-9!#$%&()*+,./:;<=>?@\[\]^_{|}~\\-]{4,})'''
